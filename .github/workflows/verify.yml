name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyflakes
      - run: python -m pyflakes acme main.py evals tests
      - run: python -m unittest discover -b -s tests -v
      - run: python evals/run.py
      - run: python main.py --invoice_path=data/invoices/invoice1.txt --quiet
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t acme-invoices .
      - run: |
          docker run -d --name acme -p 8080:8080 acme-invoices
          for i in $(seq 20); do curl -fs http://localhost:8080/api/runs && exit 0; sleep 1; done; docker logs acme; exit 1
